# Publishes to PyPI when a GitHub release is created.
#
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored anywhere.
# One-time setup, at https://pypi.org/manage/account/publishing/ :
#
#   PyPI project name : nepse-tms-api
#   Owner             : DevAbhinav2073
#   Repository        : nepse-tms-api
#   Workflow          : publish.yml
#   Environment       : pypi
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
